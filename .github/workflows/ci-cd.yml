name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run Backend Tests
        working-directory: backend
        run: |
          pytest tests -v

  test-frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Frontend
        env:
          NEXT_PUBLIC_API_URL: /api
        run: npm run build

  build-and-scan:
    runs-on: ubuntu-latest

    needs:
      - test-backend
      - test-frontend

    strategy:
      matrix:
        include:
          - service: api
            context: backend
            dockerfile: backend/Dockerfile

          - service: worker
            context: backend
            dockerfile: backend/Dockerfile.worker

          - service: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            build_args: NEXT_PUBLIC_API_URL=/api

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          build-args: ${{ matrix.build_args }}
          tags: ${{ vars.ACR_NAME }}.azurecr.io/campusconnect/${{ matrix.service }}:${{ github.sha }}

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ vars.ACR_NAME }}.azurecr.io/campusconnect/${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push Docker Image
        if: github.event_name == 'push'
        run: |
          docker push ${{ vars.ACR_NAME }}.azurecr.io/campusconnect/${{ matrix.service }}:${{ github.sha }}