name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  test-backend:
    ...

  test-frontend:
    ...

  build-and-scan:
    runs-on: ubuntu-latest
    needs:
      - test-backend
      - test-frontend

    strategy:
      matrix:
        include:
          - service: api
            context: backend
            dockerfile: backend/Dockerfile

          - service: worker
            context: backend
            dockerfile: backend/Dockerfile.worker

          - service: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            build-args: NEXT_PUBLIC_API_URL=/api

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - run: az acr login --name ${{ vars.ACR_NAME }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          push: false
          load: true
          tags: ${{ vars.ACR_NAME }}.azurecr.io/campusconnect/${{ matrix.service }}:${{ github.sha }}

      - uses: aquasecurity/trivy-action@master
        with:
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - if: github.event_name == 'push'
        run: docker push ${{ vars.ACR_NAME }}.azurecr.io/campusconnect/${{ matrix.service }}:${{ github.sha }}